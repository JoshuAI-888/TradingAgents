# TradingAgents Portal — Render blueprint (Phase 0)
# Deploy: Render dashboard → New → Blueprint → pick repo/branch, or `render blueprint launch`.
# Required env (set in dashboard or via Render MCP BEFORE first deploy):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY   — Supabase project (run deploy/supabase/0001+0002 first)
#   OPENAI_API_KEY (or other provider)   — only when WORKER_STUB_MODE=0
# Optional: MOOMOO_APPKEY / MOOMOO_PRIVATE_KEY, FRED_API_KEY, FMP_API_KEY, CRON_SECRET,
#           API_ALLOWED_ORIGINS, PORTAL_STATIC_DIR, TRADINGAGENTS_CACHE_DIR, TRADINGAGENTS_RESULTS_DIR

services:
  - type: web
    name: tradingagents-portal
    runtime: python
    plan: starter
    region: virginia
    rootDir: web
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn tradingagents_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PORTAL_STATIC_DIR
        value: /opt/render/project/src/web/api/static
      - key: WORKER_STUB_MODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true

  - type: worker
    name: tradingagents-worker
    runtime: python
    plan: starter
    region: virginia
    rootDir: web
    buildCommand: pip install -r worker/requirements.txt && pip install -e ..
    startCommand: python -m tradingagents_worker.service
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TRADINGAGENTS_CACHE_DIR
        value: /data/cache
      - key: TRADINGAGENTS_RESULTS_DIR
        value: /data/results
      - key: WORKER_STUB_MODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MOOMOO_APPKEY
        sync: false
      - key: MOOMOO_PRIVATE_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: tradingagents-data
      mountPath: /data
      sizeGB: 10

  - type: cron
    name: tradingagents-settlement
    runtime: python
    plan: starter
    region: virginia
    rootDir: web
    buildCommand: pip install -r api/requirements.txt
    schedule: "30 * * * *"          # hourly; settles anything past its horizon
    startCommand: python -m tradingagents_worker.settlement_cron
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: cron
    name: tradingagents-discovery
    runtime: python
    plan: starter
    region: virginia
    rootDir: web
    buildCommand: pip install -r api/requirements.txt
    schedule: "*/15 13-21 * * 1-5"  # 13:00–21:59 UTC weekdays = US market hours (Oregon)
    startCommand: python -m tradingagents_worker.discovery_cron
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MOOMOO_APPKEY
        sync: false
      - key: MOOMOO_PRIVATE_KEY
        sync: false
