# TradingAgents Portal — Render blueprint (Phase 0)
# Deploy: Render dashboard → New → Blueprint → pick repo/branch, or `render blueprint launch`.
# NOTE: mirrors the deployed MCP-created stack (branch product/portal-phase0):
#   * the worker runs as a WEB SERVICE (Render blueprints support `worker`, but the
#     hosted MCP path does not) — it holds $PORT open via its /healthz thread;
#   * no persistent disk — cache/results live under /tmp;
#   * build/start commands run from the repo root (`cd` inside the command).
# Required env (set in dashboard or via Render MCP BEFORE first deploy):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY   — Supabase project (run deploy/supabase/0001+ first)
#   OPENROUTER_API_KEY                   — only when WORKER_STUB_MODE=0
# Optional: MOOMOO_APPKEY / MOOMOO_PRIVATE_KEY, FRED_API_KEY, FMP_API_KEY, CRON_SECRET,
#           API_ALLOWED_ORIGINS, PORTAL_STATIC_DIR

services:
  - type: web
    name: tradingagents-portal
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r web/api/requirements.txt
    startCommand: cd web/api && uvicorn tradingagents_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PORTAL_STATIC_DIR
        value: /opt/render/project/src/web/api/static
      - key: WORKER_STUB_MODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DEFAULT_USER_ID
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: MOOMOO_APPKEY
        sync: false
      - key: MOOMOO_PRIVATE_KEY
        sync: false

  - type: web
    name: tradingagents-worker
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r web/worker/requirements.txt && pip install -e .
    startCommand: cd web/worker && python -m tradingagents_worker.service
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TRADINGAGENTS_CACHE_DIR
        value: /tmp/ta-cache
      - key: TRADINGAGENTS_RESULTS_DIR
        value: /tmp/ta-results
      - key: WORKER_STUB_MODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DEFAULT_USER_ID
        sync: false
      - key: MOOMOO_APPKEY
        sync: false
      - key: MOOMOO_PRIVATE_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false

  - type: cron
    name: tradingagents-settlement
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r web/worker/requirements.txt
    schedule: "30 * * * *"          # hourly; settles anything past its horizon
    startCommand: cd web/worker && python -m tradingagents_worker.settlement_cron
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TRADINGAGENTS_CACHE_DIR
        value: /tmp/ta-cache   # crons have no disk; /data is not writable
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: cron
    name: tradingagents-discovery
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r web/worker/requirements.txt
    schedule: "*/15 13-21 * * 1-5"  # 13:00–21:59 UTC weekdays = US market hours
    startCommand: cd web/worker && python -m tradingagents_worker.discovery_cron
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TRADINGAGENTS_CACHE_DIR
        value: /tmp/ta-cache   # crons have no disk; /data is not writable
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MOOMOO_APPKEY
        sync: false
      - key: MOOMOO_PRIVATE_KEY
        sync: false

  - type: cron
    name: tradingagents-universe
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r web/worker/requirements.txt && pip install -e .
    schedule: "0 1-8,13-21 * * 1-5"  # HK 09–16 HKT and US 13–21 UTC; one existing service
    startCommand: cd web/worker && python -m tradingagents_worker.market_cron universe
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: UNIVERSE_MARKET
        value: US
      - key: TRADINGAGENTS_CACHE_DIR
        value: /tmp/ta-cache   # crons have no disk; /data is not writable
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MOOMOO_APPKEY
        sync: false
      - key: MOOMOO_PRIVATE_KEY
        sync: false

  - type: cron
    name: tradingagents-enrich
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r web/worker/requirements.txt && pip install -e .
    schedule: "45 8,21 * * 1-5"  # HK 16:45 HKT / US 21:45 UTC
    startCommand: cd web/worker && python -m tradingagents_worker.market_cron enrich
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TRADINGAGENTS_CACHE_DIR
        value: /tmp/ta-cache   # crons have no disk; /data is not writable
      - key: ENRICH_MARKET
        value: US
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MOOMOO_APPKEY
        sync: false
      - key: MOOMOO_PRIVATE_KEY
        sync: false

  # HK shares the two screener cron services above. Routing uses UTC, not host timezone.

  # Separate classification acquisition; remains inert until release qualification.
  - type: cron
    name: tradingagents-instrument-subtypes
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r web/worker/requirements.txt && pip install -e .
    schedule: "20 * * * *"
    startCommand: cd web/worker && python -m tradingagents_worker.instrument_subtype_job
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: INSTRUMENT_SUBTYPE_COLLECTION_ENABLED
        value: "0"
      - key: INSTRUMENT_SUBTYPE_MARKET
        value: US
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: cron
    name: tradingagents-backup
    runtime: python
    plan: starter
    region: virginia
    buildCommand: pip install -r web/worker/requirements.txt
    schedule: "0 3 * * 1"           # weekly, Monday 03:00 UTC (15:00 NZST) — off US market hours
    startCommand: cd web/worker && python -m tradingagents_worker.backup
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TRADINGAGENTS_CACHE_DIR
        value: /tmp/ta-cache   # crons have no disk; /data is not writable
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
